{% load static %}
<div class="ect-contact-popup" id="ectContactPopup" aria-hidden="true">
    <div class="ect-contact-backdrop" data-contact-close></div>

    <section class="ect-contact-dialog" role="dialog" aria-modal="true" aria-labelledby="ectContactPopupTitle">
        <button type="button" class="ect-contact-close" data-contact-close aria-label="Close contact form">
            <span aria-hidden="true">×</span>
        </button>

        <div class="ect-contact-popup-head">
            <span class="ect-contact-popup-eyebrow">GET IN TOUCH</span>
            <h2 id="ectContactPopupTitle">Let's talk about <span>your business.</span></h2>
            <p>Share your requirement and our team will get back to you with the right next step.</p>
        </div>

        {% include 'components/bigin_contact_form.html' %}
    </section>
</div>
