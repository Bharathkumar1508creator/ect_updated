<script>
(function () {
    "use strict";

    function normalize(href) {
        try {
            var u = new URL(href, window.location.origin);
            var path = u.pathname.replace(/\/+$/, '') || '/';
            return path + (u.search || '');
        } catch (e) {
            return href;
        }
    }

    var currentFull = normalize(window.location.pathname + window.location.search);
    var currentPath = (window.location.pathname.replace(/\/+$/, '') || '/');

    document.querySelectorAll('.ect-navbar-menu > .ect-nav-item').forEach(function (item) {
        var topLink = item.querySelector(':scope > .ect-nav-link');
        if (!topLink) return;

        var links = item.querySelectorAll('a[href]');
        var matched = false;

        links.forEach(function (a) {
            var href = a.getAttribute('href');
            if (!href || href === '#') return;
            var norm = normalize(href);
            if (norm.indexOf('?') !== -1) {
                if (norm === currentFull) matched = true;
            } else if (norm === currentPath) {
                matched = true;
            }
        });

        if (matched) topLink.classList.add('is-active');
    });
})();
</script>
