<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}">
<meta name="robots" content="{{ seo_robots|default:'index,follow,max-image-preview:large' }}">
<link rel="canonical" href="{{ seo_canonical_url }}">
<meta property="og:locale" content="en_IN">
<meta property="og:type" content="{{ seo_og_type|default:'website' }}">
<meta property="og:site_name" content="ECOG Core Technologies">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_canonical_url }}">
{% if seo_image_url %}<meta property="og:image" content="{{ seo_image_url }}">{% endif %}
{% if seo_image_alt %}<meta property="og:image:alt" content="{{ seo_image_alt }}">{% endif %}
<meta name="twitter:card" content="{% if seo_image_url %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
{% if seo_image_url %}<meta name="twitter:image" content="{{ seo_image_url }}">{% endif %}
{% if seo_image_alt %}<meta name="twitter:image:alt" content="{{ seo_image_alt }}">{% endif %}
{% if seo_schema_json %}<script type="application/ld+json">{{ seo_schema_json|safe }}</script>{% endif %}
